x-common: &common
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  build:
    <<: *common
    # Pinned by digest, never by tag: a tag is a name its owner can move.
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    environment:
      - BASE_PATH
      - VITE_SITE_URL
    command: sh -c "npm ci && npm run build"

  preview:
    <<: *common
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    ports:
      # Loopback only. A bare "4173:4173" would put the server on the local network.
      - "127.0.0.1:4173:4173"
    command: sh -c "npm ci && npm run build && npm run preview:docker"

  # deploy.yml runs this same service and publishes the dist/ it leaves behind.
  # Plain verify skips what deploy.yml sets up first, so before calling a change ready also run verify on a copy of the tree after deploy.yml's Stamp version sed, with BASE_PATH=/pdf-annotator VITE_SITE_URL=https://jack-hallybone.github.io/pdf-annotator.
  verify:
    <<: *common
    # Microsoft's official Playwright image, used as published. Tag's version segment must match package.json's pinned @playwright/test version.
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    # CI's "Set up GitHub Pages" step resolves these and passes them on the Verify step's env (see deploy.yml); empty locally, where vite.config.ts's own fallbacks cover that case.
    environment:
      - BASE_PATH
      - VITE_SITE_URL
    # xvfb-run, not a bare verify:run: headless Chromium ships no PDF viewer at all, so tests-e2e/print.spec.ts runs headed and needs a real display. Every other spec keeps running headless as before.
    command: sh -c "npm ci && xvfb-run --auto-servernum npm run verify:run"

volumes:
  node_modules:
