name: Deploy to GitHub Pages

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build and verify
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stamps the source before the build, so Workbox hashes the real content.
      - name: Stamp version
        run: sed -i 's|<span id="version" hidden>v. dev</span>|<span id="version" hidden>v. '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'</span>|' index.html

      # Before verify: og:image needs the absolute site URL, and Open Graph consumers don't resolve relative ones.
      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # No native Node setup here: verify (dependency audit and Playwright browser included) runs entirely inside the same pinned container compose.yaml and agents use - one environment for everyone, not three.
      - name: Verify
        run: docker compose run --rm verify
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build

    # Never cancelled: a deploy already publishing must finish, or the site is left half-written.
    concurrency:
      group: pages
      cancel-in-progress: false

    # workflow_dispatch can run from any branch; never let that publish.
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # The only job holding the Pages credential. It checks out nothing and runs no repository code.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
